commonware-cryptography.workspace = true
hex.workspace = true
hub-client.workspace = true
hub-domain.workspace = true
hub-crypto.workspace = true
hub-modules.workspace = true
hub-permission.workspace = true
identity.workspace = true
k256.workspace = true
jsonrpsee.workspace = true
reqwest.workspace = true
serde_json.workspace = true
