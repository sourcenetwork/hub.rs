name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# ── Self-hosted Mac Studio runners ──────────────────────────────────
#
# Two runners (studio-1, studio-2): M3 Ultra, 32-core, 512GB RAM.
# Shared with defradb.rs and backbone — don't assume exclusive access.
# Persistent machines: kill lingering processes, reset working tree
# after every run.
#
# No [profile.test] override, no .cargo/config.toml — clippy and test
# share the same dev profile so the warm cache serves both without
# profile thrashing.

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, macOS, ARM64, studio]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Clear stale git credential config
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          rm -rf ~/.cargo/git/db/defradb.rs-* ~/.cargo/git/checkouts/defradb.rs-* 2>/dev/null || true

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all -- -D warnings

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true

  build:
    name: Build & Test
    runs-on: [self-hosted, macOS, ARM64, studio]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Clear stale git credential config
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          rm -rf ~/.cargo/git/db/defradb.rs-* ~/.cargo/git/checkouts/defradb.rs-* 2>/dev/null || true

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - name: Unit tests
        run: cargo test --workspace --exclude hub-e2e

      - name: Build hubd
        run: cargo build -p hubd

      - name: Cache hubd binary for backbone CI
        run: |
          HASH=$(git rev-parse HEAD)
          CACHE_DIR="$HOME/.sourcenetwork/bin/hub.rs/$HASH"
          mkdir -p "$CACHE_DIR"
          cp target/debug/hubd "$CACHE_DIR/hubd" || cp target/release/hubd "$CACHE_DIR/hubd" || true
          [ -f "$CACHE_DIR/hubd" ] && ln -sf "$CACHE_DIR/hubd" "$HOME/.sourcenetwork/bin/hubd"

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- .
          git clean -fd

  e2e:
    name: "E2E (${{ matrix.suite }})"
    runs-on: [self-hosted, macOS, ARM64, studio]
    needs: [build]
    timeout-minutes: 20
    env:
      HUBD_BINARY: ${{ github.workspace }}/target/debug/hubd
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: canonical
            tests: --test hub_e2e_canonical
          - suite: extended
            tests: >-
              --test core_chain
              --test contract_deploy
              --test light_client
              --test gossip_headers
              --test validator_bootstrap
              --test validator_epoch_transition
              --test cross_object_acp
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Clear stale git credential config
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          rm -rf ~/.cargo/git/db/defradb.rs-* ~/.cargo/git/checkouts/defradb.rs-* 2>/dev/null || true

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - name: Kill leftover hubd processes
        # The e2e harness spawns nodes from $HUBD_BINARY (target/debug/hubd),
        # so match that path. The previous pattern only matched test-harness
        # binaries under deps/ and left port-holding hubd nodes alive, stalling
        # the next run's cluster at height 0.
        run: pkill -f 'target/debug/hubd' 2>/dev/null || true

      - name: Build hubd
        run: cargo build -p hubd

      - name: Run e2e tests
        run: cargo test -p hub-e2e ${{ matrix.tests }} -- --nocapture
        timeout-minutes: 15

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- .
          git clean -fd
          pkill -f 'target/debug/hubd' 2>/dev/null || true
          rm -rf /tmp/hub-e2e-* /tmp/.tmp* 2>/dev/null || true

  artifacts:
    name: Release Artifacts
    runs-on: [self-hosted, macOS, ARM64, studio]
    needs: [build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Clear stale git credential config
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          rm -rf ~/.cargo/git/db/defradb.rs-* ~/.cargo/git/checkouts/defradb.rs-* 2>/dev/null || true

      - name: Configure private repo access
        run: git config --global url."https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"

      - name: Build release hubd
        run: cargo build --release -p hubd

      - name: Upload hubd
        uses: actions/upload-artifact@v4
        with:
          name: hubd-aarch64-apple-darwin
          path: target/release/hubd
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          git config --global --remove-section "url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/" 2>/dev/null || true
          git checkout -- .
          git clean -fd

  linux-native:
    name: Linux native service
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
      HUBD_BINARY: ${{ github.workspace }}/target/debug/hubd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev protobuf-compiler

      - name: Install pinned toolchain
        run: |
          rustc --version
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-native-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Fetch locked dependencies
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/sourcenetwork/
        run: cargo fetch --locked

      - name: Native module and storage checks
        run: |
          cargo test --frozen -p hub-modules --lib
          cargo test --frozen -p hub-backend --test native_state --test native_hydration

      - name: Build native node
        run: cargo build --frozen -p hubd

      - name: Native lifecycle and recovery
        run: >-
          cargo test --frozen -p hub-e2e
          --test native_permission
          --test native_signed_operation
          --test native_bulletin
          --test native_registration
          --test native_membership
          --test quorum_recovery
          --test cold_replay
          --test snapshot_catchup
          -- --test-threads=1 --nocapture

      - name: Build crash-injection node
        run: cargo build --frozen -p hubd --features fault-injection

      - name: Interrupted commit and snapshot recovery
        run: >-
          cargo test --frozen -p hub-e2e --features fault-injection
          --test module_commit_crash --test snapshot_interrupt
          -- --test-threads=1 --nocapture

      - name: Build release node without fault injection
        run: cargo build --frozen --release -p hubd
